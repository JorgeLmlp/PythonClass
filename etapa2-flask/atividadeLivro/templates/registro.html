{% extends "base.html" %}

{% block title %}
Registro de Usuário
{% endblock %}


{% block content %}

<div class="container">

    <h2>Cadastro</h2>

    {% if erro %}
        <p class="erro">
            {{ erro }}
        </p>
    {% endif %}

    <form method="POST" action="{{ url_for('user_bp.registraUsuario') }}">

        <label for="nome">Nome:</label>
        <input 
            type="text"
            id="nome"
            name="nome"
            value="{{ request.form.get('nome', '') }}"
            required
        >

        <label for="email">Email:</label>
        <input 
            type="email"
            id="email"
            name="email"
            value="{{ request.form.get('email', '') }}"
            required
        >

        <label for="senha">Senha:</label>
        <input 
            type="password"
            id="senha"
            name="senha"
            required
        >

        <button type="submit">
            Registrar
        </button>

    </form>

</div>

{% endblock %}
