{% extends "base.html" %}


{% block title %}
Nova Tarefa
{% endblock %}


{% block content %}

<div class="form-container">

<h1>Nova tarefa</h1>


<form method="POST" action="{{ url_for('tarefas_bp.criarTarefa') }}">


    <label>
        Título:
    </label>

    <input 
        type="text"
        name="titulo"
        required
    >


    <label>
        Descrição:
    </label>

    <textarea 
        name="descricao"
        required
    ></textarea>


    <button type="submit">
        Criar tarefa
    </button>


</form>


</div>

{% endblock %}
